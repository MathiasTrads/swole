name: Morning reminder
on:
  schedule:
    # GitHub often starts scheduled runs late, so we start ~90 min early and the script waits until 06:05.
    - cron: "35 2 * * *"   # summer time (CEST): 04:35 local
    - cron: "35 3 * * *"   # winter time (CET): 04:35 local
  workflow_dispatch:
    inputs:
      force:
        description: "Send now, whatever the time"
        type: boolean
        default: true
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3.6.7
      - run: node scripts/remind.mjs
        env:
          TZ: Europe/Copenhagen
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          REMINDER_SECRET: ${{ secrets.REMINDER_SECRET }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          DATA_REPO: ${{ github.repository_owner }}/swole-data
          SCHEDULE: ${{ github.event.schedule }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
